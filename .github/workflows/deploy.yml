# Deploy phanvugiap.com → Cloudflare Workers (static assets), same model as hexasync.vn.
# Trigger: push to main, or run by hand (Actions → Deploy → Run workflow).
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   Account: Workers Scripts Edit + Account Settings Read;
#                          Zone phanvugiap.com: Workers Routes Edit + DNS Edit
#                          (DNS lets wrangler attach the custom domains in wrangler.jsonc)
#   CLOUDFLARE_ACCOUNT_ID  32-hex account ID
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
